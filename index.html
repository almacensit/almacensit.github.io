<!doctype html>
<html lang="es">

<title>Almacén</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a3d7a; overflow: hidden; }

</style>

<body>
<div id="carga"><img src="icon-192.png" alt=""><div>Abriendo Almacén…</div></div>
<iframe id="app" title="Almacén" allow="camera *; geolocation *; clipboard-write *"
        src="https://script.google.com/macros/s/AKfycbwggQtiT8u7tqF0KdtuDUCJsv12XINwQ43u6aUoMEHID78EYG3kxSZIqFohVJJ9fvAbJg/exec"></iframe>
<script>

</script>
